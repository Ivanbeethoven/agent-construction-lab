name: Reconstructed core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install local validation dependencies
        run: python -m pip install -e . -r requirements-smoke.txt
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Seven-condition localhost HTTP and official GEPA smoke
        run: python -m agent_construction_lab.fixed_model smoke --out runs/local-ci/smoke
      - name: Verify frozen runtime and harnesses
        run: python -m agent_construction_lab.fixed_model verify-run --run runs/local-ci/smoke
      - name: Simulator CLI
        run: construction-lab pilot --config configs/pilot_quick.json --out runs/local-ci/simulator
