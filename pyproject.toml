[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-construction-lab"
version = "0.3.0"
description = "A reproducible prototype for construction-time conditional agent specialization"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
construction-lab = "agent_construction_lab.cli:main"
construction-lab-fixed = "agent_construction_lab.fixed_model.__main__:main"

[project.optional-dependencies]
fixed-model = ["gepa==0.1.4", "appworld==0.1.3.post1; python_version >= '3.11'"]

[tool.setuptools.packages.find]
include = ["agent_construction_lab*"]

[tool.setuptools.package-data]
agent_construction_lab = ["task_fixtures.json"]
